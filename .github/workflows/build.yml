name: Build

on:
  push:
    branches: [main]
    tags: ['v*'] # Push events to matching v*, i.e. v1.0, v20.15.10
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# All packaging is done by the fyne tool, which is pinned in go.mod (`tool` directive)
jobs:
  linux-windows:
    name: Build Linux and Windows
    # oldest supported Ubuntu for broad glibc compatibility of the Linux binary
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install gcc libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev \
            gcc-mingw-w64-x86-64

      - name: Vet and test
        run: |
          go vet ./...
          go test ./...

      - name: Get version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(sed -n 's/^ *Version = "\(.*\)"/\1/p' FyneApp.toml)" >> "$GITHUB_OUTPUT"
          fi

      - name: Package (Linux)
        run: |
          go tool fyne package --os linux --release \
            --app-version "${{ steps.version.outputs.version }}" --app-build "${{ github.run_number }}"
          mkdir -p dist
          mv Clipster.tar.xz dist/clipster_linux.tar.xz

      - name: Package (Windows)
        env:
          CC: x86_64-w64-mingw32-gcc
          GOARCH: amd64
          # do not depend on the MinGW runtime DLLs, the exe must be a single file
          GOFLAGS: -ldflags=-extldflags=-static
        run: |
          # Build the fyne tool for this machine first. CC and GOARCH above are meant for the
          # Windows target and would break building the tool itself
          FYNE=$(env -u CC -u GOARCH -u GOFLAGS go tool -n fyne)
          "$FYNE" package --os windows --release \
            --app-version "${{ steps.version.outputs.version }}" --app-build "${{ github.run_number }}"
          mv Clipster.exe dist/clipster_win.exe
          echo "Imported DLLs:"
          x86_64-w64-mingw32-objdump -p dist/clipster_win.exe | sed -n 's/^\s*DLL Name: //p' | sort -u
          if x86_64-w64-mingw32-objdump -p dist/clipster_win.exe | grep -iE 'DLL Name: (libgcc|libwinpthread|libstdc)'; then
            echo "::error::exe depends on MinGW runtime DLLs"
            exit 1
          fi

      - name: Show artifact sizes
        run: ls -l dist

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-windows
          path: dist/*
          if-no-files-found: error

  macos:
    name: Build macOS
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Get version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(sed -n 's/^ *Version = "\(.*\)"/\1/p' FyneApp.toml)" >> "$GITHUB_OUTPUT"
          fi

      # One universal binary (Apple Silicon and Intel) instead of one download per architecture.
      # The name of the binary ends up in the app bundle
      - name: Build universal binary
        run: |
          mkdir -p build/arm64 build/amd64 build/universal
          for arch in arm64 amd64; do
            CGO_ENABLED=1 GOARCH=$arch go build -trimpath -tags release -ldflags "-s -w" \
              -o build/$arch/clipster .
          done
          lipo -create -output build/universal/clipster build/arm64/clipster build/amd64/clipster
          lipo -info build/universal/clipster

      - name: Create app bundle
        run: |
          go tool fyne package --os darwin --release --executable build/universal/clipster \
            --app-version "${{ steps.version.outputs.version }}" --app-build "${{ github.run_number }}"
          # Apple Silicon refuses to run unsigned code, so ad-hoc sign the bundle
          codesign --force --deep --sign - Clipster.app
          codesign --verify --verbose Clipster.app
          mkdir -p dist
          # ditto keeps the extended attributes holding signatures, unlike zip
          ditto -c -k --keepParent Clipster.app dist/clipster_mac.zip
          ls -l dist

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/clipster_mac.zip
          if-no-files-found: error

  release:
    name: Create Release
    needs: [linux-windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ github.ref_name }}
          files: dist/*
