name: Build

on:
  push:
    branches: [master]
    tags: ['v*'] # Push events to matching v*, i.e. v1.0, v20.15.10
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # oldest supported Ubuntu for broad glibc compatibility of the binary
          - os: ubuntu-22.04
            target: linux
            out_file: clipster_linux.zip
          - os: macos-15
            target: macos-arm64
            out_file: clipster_mac.zip
          - os: macos-15-intel
            target: macos-intel
            out_file: clipster_mac_intel.zip
          - os: windows-2025
            target: windows
            out_file: clipster_win.zip

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Linux
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get -y install libgtk-3-dev libayatana-appindicator3-dev

      - name: Vet and test (Linux)
        if: runner.os == 'Linux'
        run: |
          go vet ./...
          go test ./...

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          go build -trimpath -o build/clipster_linux -ldflags "-s -w" .
          cd build && zip -r9 ${{ matrix.out_file }} clipster_linux

      # MacOS
      - name: Install conda (MacOS)
        if: runner.os == 'macOS'
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          auto-activate: true
          activate-environment: ""

      - name: Install dependencies (MacOS)
        if: runner.os == 'macOS'
        shell: bash -el {0}
        # conda-forge ships some pkg-config files separately from the libraries:
        # zlib (zlib.pc for gio-2.0) and expat (expat.pc for fontconfig)
        run: |
          conda install -y -q -c conda-forge gtk3 glib zlib expat pkg-config
          PKG_CONFIG_PATH="$CONDA/lib/pkgconfig" "$CONDA/bin/pkg-config" --cflags --libs \
            gtk+-3.0 gdk-3.0 gio-2.0 glib-2.0 gobject-2.0 gmodule-2.0 \
            cairo cairo-gobject pango pangocairo fontconfig gdk-pixbuf-2.0 > /dev/null

      - name: Build (MacOS)
        if: runner.os == 'macOS'
        shell: bash -el {0}
        run: |
          export PKG_CONFIG="$CONDA/bin/pkg-config"
          export PKG_CONFIG_PATH="$CONDA/lib/pkgconfig"
          go build -trimpath -o build/clipster_mac -ldflags "-s -w" .

      - name: Create app bundle (MacOS)
        if: runner.os == 'macOS'
        shell: bash -el {0}
        run: |
          git clone --depth 1 https://github.com/mc51/gtk-mac-bundler
          (cd gtk-mac-bundler && make install)
          export PKG_CONFIG_PATH="$CONDA/lib/pkgconfig"
          ~/.local/bin/gtk-mac-bundler ./build/bundle/clipster.bundle
          cd build && zip -r9 ${{ matrix.out_file }} clipster_mac.app/

      # Windows
      - name: Install MINGW64 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          install: >-
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-gtk3
            mingw-w64-x86_64-gcc
            glib2-devel
            base-devel
            zip

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          CGO_ENABLED: '1'
        run: |
          go run github.com/akavel/rsrc@v0.10.2 -ico assets/clipster_icon_64.ico -o rsrc_windows_amd64.syso
          sed -i -e 's/-Wl,-luuid/-luuid/g' /mingw64/lib/pkgconfig/gdk-3.0.pc
          go build -trimpath -o build/bin/clipster_win.exe -ldflags "-H=windowsgui -s -w" .

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          mkdir -p build/clipster build/lib/ build/share/glib-2.0/ build/share/icons/Adwaita/
          mv /mingw64/bin/*.dll build/bin/
          mv /mingw64/share/icons/hicolor/ build/share/icons/
          cp /mingw64/share/icons/Adwaita/* build/share/icons/Adwaita/ || :
          mv /mingw64/share/icons/Adwaita/16x16/ build/share/icons/Adwaita/ || :
          mv /mingw64/share/glib-2.0/schemas/ build/share/glib-2.0/
          mv /mingw64/lib/gdk-pixbuf-2.0/ build/lib/
          cd build && mv bin lib share clipster/
          zip -r9 ${{ matrix.out_file }} clipster/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: build/${{ matrix.out_file }}
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ github.ref_name }}
          files: dist/*.zip
